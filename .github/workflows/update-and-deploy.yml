name: Update and deploy alpha feed
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh signals
        run: python scripts/update.py || echo "updater failed, deploying last known data"
      - name: Commit refreshed data
        run: |
          git config user.name "shado-alpha-bot"
          git config user.email "actions@github.com"
          git add data/signals.json data/last_update.json || true
          git diff --staged --quiet || git commit -m "chore: refresh signals"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
